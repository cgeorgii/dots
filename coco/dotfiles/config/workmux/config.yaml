agent: claude
mode: session
nerdfont: true

# No PR column or PR placeholders: they run `gh repo view`, which prompts for
# the SSH key.
dashboard:
  agent_columns: [number, project, worktree, git, status, time, title]
  worktree_columns: [number, project, worktree, git, mux, age, agent]

sidebar:
  templates:
    tiles:
      - "{primary} {pane_suffix} {fill} {elapsed}"
      - "{pane_title} {fill} {git_stats}"
    compact: "{status_icon} {primary} {pane_suffix} {fill} {elapsed}"
    horizontal:
      - "{status_icon} {primary} {pane_suffix} {fill} {elapsed}"
      - "{secondary} {fill} {git_stats}"
      - "{pane_title}"
    grouped:
      tiles:
        - "{primary} {pane_suffix} {fill} {elapsed}"
        - "{pane_title} {fill} {git_stats}"
      compact: "{status_icon} {primary} {pane_suffix} {fill} {elapsed}"

panes:
  - command: <agent>
  - command: nvim prompt.md
    focus: true
    split: horizontal
    percentage: 50
  - command: git log --oneline --decorate -10
    split: vertical
    percentage: 30

files:
  copy:
    - .env.local
  symlink:
    - .workmux.yaml
    - .claude/settings.local.json

post_create:
  - touch -d "$(git log -1 --format=@%ct -- .envrc)" .envrc
  - touch -d "$(git log -1 --format=@%ct -- flake.nix)" flake.nix
  - touch -d "$(git log -1 --format=@%ct -- flake.lock)" flake.lock
  - direnv allow
