[workspace]
resolver = "2"
members = ["meld", "autoname", "bar"]

# One zellij-tile for every plugin; plugins.nix checks it against the zellij
# in nixpkgs.
[workspace.dependencies]
zellij-tile = "=0.46.0"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
lto = true
strip = true
